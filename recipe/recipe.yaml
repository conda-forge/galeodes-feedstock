schema_version: 1

context:
  name: galeodes
  version: "0.7"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/galeodes-${{ version }}.tar.gz
  sha256: 31ea839ab8974fd52b2e2e9f230d84683f15b0a1d0e336d8b668dff2ca2356bf

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - galeodes=galeodes.__main__:main_logic

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - pillow
    - python >=${{ python_min }}
    - requests
    - selenium

tests:
  - python:
      imports:
        - galeodes
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - galeodes --help

about:
  summary: Browsers options
  license: AGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/qeeqbox/galeodes

extra:
  recipe-maintainers:
    - jan-janssen
